name: Integration contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run demo
      - run: npm run run-pipeline -- --config fixtures/synthetic/adapters/pipeline.json --source fixtures/synthetic/source.arb --target fixtures/synthetic/target.arb --glossary fixtures/synthetic/glossary.csv --out work/pipeline-ci --synthetic

  flutter-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: npm ci
      - run: npm run integration-smoke -- --out work/integration-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-integration-evidence
          retention-days: 7
          path: |
            work/integration-ci/integration-evidence.json
            work/integration-ci/flutter/evidence.json
            work/integration-ci/flutter/flutter.log
            work/integration-ci/package/manifest.json
